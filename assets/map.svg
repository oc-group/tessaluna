  <path d="M120 30 C 200 70, 240 150, 230 270" fill="none" stroke="#6b8f5a" stroke-width="10" stroke-opacity=".35"/>
  <circle cx="232" cy="140" r="9" fill="#7fb7d1" stroke="#4a86a3"/>
  <polygon points="190,95 200,75 210,95" fill="#7a6a4a"/>
  <rect x="255" y="215" width="14" height="10" fill="#f2f2f2" stroke="#999"/>
